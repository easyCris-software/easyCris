name: CLA Check

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  pull-requests: read
  contents: read

jobs:
  cla:
    name: cla-check
    runs-on: ubuntu-latest
    steps:
      - name: Validate CLA checkbox in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request?.body || "").toLowerCase();
            const lines = body.split(/\r?\n/).map((line) => line.trim());
            // Keep this token in sync with .github/pull_request_template.md checklist text.
            const requiredToken = "- [x] i have read and agree to the contributor license agreement in `cla.md`.";
            const ok = lines.includes(requiredToken);
            if (!ok) {
              core.setFailed("CLA not accepted. Check the CLA checkbox in the PR template.");
            }
