[package]
name = "easycris-remote-signaling"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Supply-chain check 2026-05-17: sha1 0.10 was already present transitively; crates.io/RustSec search found no known compromise.
sha1 = "0.10"
sha2 = "0.10"
# Supply-chain check 2026-05-17: subtle 2.6 was already present; crates.io/RustSec search found no known compromise.
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
